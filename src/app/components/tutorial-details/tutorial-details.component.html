@if (viewMode){
  @if (currentTutorial.id){
  <h4>Person</h4>
  <div>
    <label><strong>Name:</strong></label> {{ currentTutorial.name }}
  </div>
  <div>
    <label><strong>Email:</strong></label>
    {{ currentTutorial.email }}
  </div>

  <a class="badge badge-warning" routerLink="/tutorials/{{ currentTutorial.id }}">
    Edit
  </a>
  } @else {<p>Please click on a Person...</p>}
} @else {
  @if (currentTutorial.id) {
  <div class="edit-form">
    <h4>Person</h4>
    <form>
      <div class="form-group">
        <label for="title">Name</label>
        <input
          type="text"
          class="form-control"
          id="title"
          [(ngModel)]="currentTutorial.name"
          name="title"
        />
      </div>
      <div class="form-group">
        <label for="description">Email</label>
        <input
          type="text"
          class="form-control"
          id="description"
          [(ngModel)]="currentTutorial.email"
          name="description"
        />
      </div>
    </form>
    <button class="badge badge-danger mr-2" (click)="deleteTutorial()">
      Delete
    </button>

    <button
      type="submit"
      class="badge badge-success mb-2"
      (click)="updateTutorial()">
      Update
    </button>
    <p>{{ message }}</p>
  </div>
  } @else {<p>Cannot access this Person...</p>}
}
