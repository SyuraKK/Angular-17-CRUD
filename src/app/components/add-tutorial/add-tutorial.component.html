<div>
  <div class="submit-form">
    @if (!submitted) {
    <div class="form-group">
      <label for="title">Name</label>
      <input
        type="text"
        class="form-control"
        id="title"
        required
        [(ngModel)]="tutorial.name"
        name="title"
      />
    </div>

    <div class="form-group">
      <label for="description">Email</label>
      <input
        class="form-control"
        id="description"
        required
        [(ngModel)]="tutorial.email"
        name="description"
      />
    </div>

    <button (click)="saveTutorial()" class="btn btn-success">Submit</button>
    } @else {
    <h4>Person was submitted successfully!</h4>
    <button class="btn btn-success" (click)="newTutorial()">Add</button>
    }
  </div>
</div>
